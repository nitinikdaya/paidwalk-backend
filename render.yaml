services:
  - type: web
    name: paidwalk-api
    runtime: python
    plan: free
    rootDir: paidwalk-backend1/backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: PAIDWALK_SECRET
        generateValue: true
      - key: PAIDWALK_SANDBOX
        value: "1"
      - key: PAIDWALK_PAYOUT
        value: "sandbox"
      - key: PAIDWALK_DB
        value: "/tmp/paidwalk.db"
